name: "Self-Healing Docs (Local Ollama)"

on:
  pull_request:
    paths:
      - "**.py"
      - "**.md"

jobs:
  doc-healing:
    # This instructs GitHub to run the job on the user's connected laptop
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Connects directly to Ollama already running on the user's laptop
      - name: Run Self-Healing Documentation Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OLLAMA_HOST: "http://localhost:11434"
          OLLAMA_MODEL: "qwen2.5-coder:7b"
          CONFIDENCE_THRESHOLD: "0.75"
        run: |
          python -m src.runner

      - name: Commit and Push Documentation Fixes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain "*.md") ]]; then
            git add *.md
            git commit -m "docs: auto-heal documentation drift [skip ci]"
            git push
          fi